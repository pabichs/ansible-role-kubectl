---
kubectl_version: v1.32.0
kubectl_k_shortcut: true

kubectl_checksum_url: "sha512:https://cdn.dl.k8s.io/release/{{ kubectl_version }}/bin/{{ ansible_system | lower }}/{{ (ansible_architecture == 'x86_64') | ternary('amd64', 'arm64') }}/kubectl.sha512"
kubectl_download_url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/{{ ansible_system | lower }}/{{ (ansible_architecture == 'x86_64') | ternary('amd64', 'arm64') }}/kubectl"

kubectl_download_dir: /opt/
kubectl_owner: root
kubectl_group: root
kubectl_mode: "777"

kubectl_install_dir: /usr/local/bin/
